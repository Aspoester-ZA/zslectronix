<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z'S LECTRONIX</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;display=swap

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:#020617;
color:white;
}

nav{
position:fixed;
top:0;
width:100%;
padding:15px 8%;
background:rgba(0,0,0,.9);
display:flex;
justify-content:space-between;
align-items:center;
z-index:999;
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:2rem;
font-weight:900;
color:#00e5ff;
}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.8)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=80");
background-size:cover;
background-position:center;
}

.hero h1{
font-family:'Orbitron';
font-size:5rem;
color:#00e5ff;
}

.hero p{
font-size:1.2rem;
margin:20px 0;
}

.button{
display:inline-block;
padding:15px 35px;
background:#00e5ff;
color:black;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

.section{
padding:100px 8%;
}

.title{
text-align:center;
font-size:3rem;
color:#00e5ff;
font-family:'Orbitron';
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#111827;
